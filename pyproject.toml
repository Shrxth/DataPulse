[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "0.1.0"
description = "Automated data intelligence pipeline with ingestion, analytics, anomaly detection, reporting, and dashboarding."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Shreysth Goyal" }
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "requests>=2.32,<3",
    "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1"
]

[project.scripts]
datapulse = "datapulse.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
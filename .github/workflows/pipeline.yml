name: DataPulse Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run DataPulse
        run: python -m datapulse.pipeline

      - name: Commit generated results
        run: |
          git config user.name "DataPulse Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/ database/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "data: update daily DataPulse results"
            git push
          fi
